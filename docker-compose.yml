services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    env_file: .env
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata: